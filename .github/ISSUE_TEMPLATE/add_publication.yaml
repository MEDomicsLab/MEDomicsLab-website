name: "Add a new publication"
description: Request that a publication (journal paper, conference paper, or preprint) be added to the lab's publications list.
title: "[PUB] - <publication title>"
labels:
  - "content"
  - "publication"
assignees:
  - "simonprovost"
body:
  - type: markdown
    attributes:
      value: |
        <div align="center">
          <a href="https://medomicslab.com/">
            <img src="https://raw.githubusercontent.com/MEDomicsLab/MEDomicsLab-website/refs/heads/main/docs/assets/banner/medomicslab-banner.webp" alt="MEDomicsLab banner" width="320">
          </a>
          <br>
          <strong>Official MEDomicsLab's Website.</strong>
          <br>
          <a href="https://medomicslab.com/">Live site</a>
        </div>


        Publications are grouped by year. The automation derives the slug from the title and display year and saves it in `publications.json` — you do not need to provide one.

        The entry links directly to the publication.
  - type: checkboxes
    id: checks
    attributes:
      label: "Before submitting"
      options:
        - label: I have searched the publications page and this entry does not already exist.
          required: true
        - label: All listed authors agree to be credited on the public site.
          required: true
        - label: For each lab-affiliated author, the name matches the spelling used in `src/data/team.json` (so it appears on their team profile).
          required: true
  - type: input
    id: title
    attributes:
      label: "Title"
      description: Exact title as it appears in the publication.
      placeholder: "e.g. Leveraging patients' longitudinal data to improve the Hospital One-year Mortality Risk"
    validations:
      required: true
  - type: input
    id: contributors
    attributes:
      label: "Contributors"
      description: Comma-separated, in publication order. Saved as a `contributors` array in `publications.json`. Use the same spelling as `team.json` for lab members so the publication appears on their team profiles.
      placeholder: "Hakima Laribi, Nicolas Raymond, Martin Vallières"
    validations:
      required: true
  - type: input
    id: journal
    attributes:
      label: "Venue / journal / conference"
      placeholder: "e.g. Health Information Science and Systems"
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: "Type"
      description: Must be one of the three values supported by `publications.schema.json`. Use "Conference Papers" for full manuscripts. Submit conference abstracts, talks and posters with the "Add an event" form.
      options:
        - "Journal Papers"
        - "Conference Papers"
        - "Preprints"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: "Publication date"
      description: ISO format `YYYY-MM-DD`. Used for sorting within the year.
      placeholder: "2025-03-04"
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: "Display year"
      description: Four-digit year string used to group the entry (often the same as the date year, but can differ for accepted-but-not-yet-published works).
      placeholder: "2025"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: "Primary link (DOI / publisher URL)"
      description: Public HTTPS URL for the DOI, publisher page, or preprint.
      placeholder: "https://doi.org/..."
    validations:
      required: true
