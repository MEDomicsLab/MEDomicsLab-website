name: "Add an event"
description: Announce a thesis defense, symposium, talk, workshop, or other lab event.
title: "[EVENT] - <event title>"
labels:
  - "content"
  - "event"
assignees:
  - "simonprovost"
body:
  - type: markdown
    attributes:
      value: |
        <div align="center">
          <a href="https://medomicslab.com/">
            <img src="https://raw.githubusercontent.com/MEDomicsLab/MEDomicsLab-website/refs/heads/main/docs/assets/banner/medomicslab-banner.webp" alt="MEDomicsLab banner" width="320">
          </a>
          <br>
          <strong>Official MEDomicsLab's Website.</strong>
          <br>
          <a href="https://medomicslab.com/">Live site</a>
        </div>

        <em>Feeds <code>src/data/events.json</code> and <code>src/content/community/events/&lt;slug&gt;.md</code>.</em>

        Events are grouped by year → month. Event details (kind, dates, venue) are stored in `events.json` and displayed in the right-hand sidebar alongside contributors. The location field supplies the sidebar venue. The Markdown body holds time, registration, links, description, abstract, agenda, and media. Talks and posters belong here, not in the publication form.

        See [`src/content/_templates/event.md`](https://github.com/MEDomicsLab/MEDomicsLab-website/blob/main/src/content/_templates/event.md) for the markdown skeleton.
  - type: checkboxes
    id: checks
    attributes:
      label: "Before submitting"
      options:
        - label: All people named in the event consent to being listed publicly.
          required: true
        - label: Lab member names match `src/data/team.json` exactly.
          required: true
  - type: input
    id: title
    attributes:
      label: "Event title"
      placeholder: "Thesis Defense: Analyzing the complexity of radiomics …"
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: "Suggested slug"
      description: Lowercase, hyphenated. Prefix with a date only when it is known.
      placeholder: "2024-08-20-msc-mall"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "Event kind"
      description: Also decides the event's filter category on the Events page (talks and posters → Presentations, defenses → Thesis Defenses, and so on).
      options:
        - "Thesis defense (PhD)"
        - "Thesis defense (MSc)"
        - "Symposium"
        - "Workshop"
        - "Invited talk"
        - "Conference talk / poster"
        - "Lab meeting / seminar"
        - "Lab life / social"
        - "Outreach"
        - "Other"
    validations:
      required: true
  - type: input
    id: start-date
    attributes:
      label: "Start date"
      description: Optional. ISO `YYYY-MM-DD`, only when explicitly stated in the source text, title, or images. Leave unknown dates blank and supply a listing month below.
      placeholder: "2024-08-20"
    validations:
      required: false
  - type: input
    id: listing-month
    attributes:
      label: "Listing month"
      description: Required when the start date is unknown. Use `YYYY-MM` to choose the timeline group; this does not create a sidebar date. If a start date is supplied, its month is used.
      placeholder: "2024-08"
    validations:
      required: false
  - type: input
    id: end-date
    attributes:
      label: "End date"
      description: Optional. ISO `YYYY-MM-DD`, only when explicitly known. Requires a start date and must be on or after it.
      placeholder: "2024-08-22"
    validations:
      required: false
  - type: input
    id: time
    attributes:
      label: "Time (with timezone)"
      placeholder: "14:00–16:00 EDT"
    validations:
      required: false
  - type: input
    id: location
    attributes:
      label: "Location"
      description: Optional. Only give a venue explicitly named in the source. Put meeting and registration links in the description below.
      placeholder: "Université de Sherbrooke, room D7-1010 (hybrid)"
    validations:
      required: false
  - type: input
    id: contributors
    attributes:
      label: "Contributors / speakers"
      description: Comma-separated. Saved as a `contributors` array in `events.json`. Use `team.json` spelling for lab members so cross-links work. These names appear in the Researchers sidebar; do not repeat them in an Authors section.
      placeholder: "Mahdi Loutfi"
    validations:
      required: true
  - type: textarea
    id: blurb
    attributes:
      label: "Short blurb"
      description: Optional. The events listing shows the title only; if provided, this becomes the opening paragraph of the markdown file.
      placeholder: "Mahdi Loutfi's MSc thesis defense."
    validations:
      required: false
  - type: textarea
    id: body
    attributes:
      label: "Full description (Markdown)"
      description: |
        Saved to `src/content/community/events/<slug>.md`. Supports inline HTML and standard Markdown images. Put each photo in its own paragraph for full-width images with rounded corners.
        Markdown image links such as `![description](https://example.com/image.jpg)` remain externally hosted: use stable, public URLs only. They are not copied or optimized by this form.
      placeholder: "Abstract, agenda, speaker bios, etc. Available date, type, venue, and contributors appear automatically in the sidebar."
    validations:
      required: true
  - type: input
    id: registration
    attributes:
      label: "Registration / RSVP link"
      placeholder: "Optional"
    validations:
      required: false
  - type: textarea
    id: assets
    attributes:
      label: "Images / attachments for maintainer review"
      description: |
        Attach files a maintainer should review. They are not automatically copied to the repository or published; a maintainer will add approved assets to the PR. Include descriptive alt text and the intended photo order.
    validations:
      required: false
  - type: dropdown
    id: related
    attributes:
      label: "Companion content to publish?"
      description: For maintainer review. Submit a separate form for each companion entry; these selections do not create it automatically.
      multiple: true
      options:
        - "News post announcing the event"
        - "News post recapping the event afterwards"
        - "Linked publication entry"
  - type: textarea
    id: additional
    attributes:
      label: "Additional context"
      placeholder: "Optional."
    validations:
      required: false
