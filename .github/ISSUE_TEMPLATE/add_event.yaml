name: "Add an event"
description: Announce a thesis defense, symposium, talk, workshop, or other lab event.
title: "[EVENT] - <event title>"
labels:
  - "content"
  - "event"
assignees:
  - "simonprovost"
body:
  - type: markdown
    attributes:
      value: |
        <div align="center">
          <a href="https://medomicslab.com/">
            <img src="https://raw.githubusercontent.com/MEDomicsLab/MEDomicsLab-website/refs/heads/main/docs/assets/banner/medomicslab-banner.webp" alt="MEDomicsLab banner" width="320">
          </a>
          <br>
          <strong>Official MEDomicsLab's Website.</strong>
          <br>
          <a href="https://medomicslab.com/">Live site</a>
        </div>

        <em>Feeds <code>src/data/events.json</code> and <code>src/content/community/events/&lt;slug&gt;.md</code>.</em>

        Events appear on the Events calendar as a card (title, date, speakers' photos, and the event's pictures). Opening a card shows the event: its details (kind, dates, venue) and contributors on the left, stored in `events.json`, and the Markdown body on the right. The location field supplies the venue. The Markdown body holds time, description, abstract, agenda, and media; links listed under a `## Links` heading are shown beside the event details. An event with a future start date also appears among the upcoming events on the homepage. Talks and posters belong here, not in the publication form.

        See [`src/content/_templates/event.md`](https://github.com/MEDomicsLab/MEDomicsLab-website/blob/main/src/content/_templates/event.md) for the markdown skeleton.
  - type: checkboxes
    id: checks
    attributes:
      label: "Before submitting"
      options:
        - label: All people named in the event consent to being listed publicly.
          required: true
        - label: Lab member names match `src/data/team.json` exactly.
          required: true
  - type: input
    id: title
    attributes:
      label: "Event title"
      placeholder: "Thesis Defense: Analyzing the complexity of radiomics …"
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: "Suggested slug"
      description: Lowercase, hyphenated. Prefix with a date only when it is known.
      placeholder: "2024-08-20-msc-mall"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "Event kind"
      description: Also decides the event's colour and filter type on the Events calendar (talks and posters → Presentations, defenses → Thesis Defenses, and so on).
      options:
        - "Thesis defense (PhD)"
        - "Thesis defense (MSc)"
        - "Symposium"
        - "Workshop"
        - "Invited talk"
        - "Conference talk / poster"
        - "Lab meeting / seminar"
        - "Forum / community of practice"
        - "Lab life / social"
        - "Outreach"
        - "Other"
    validations:
      required: true
  - type: input
    id: start-date
    attributes:
      label: "Start date"
      description: Optional. ISO `YYYY-MM-DD`, only when explicitly stated in the source text, title, or images. Leave unknown dates blank and supply a listing month below.
      placeholder: "2024-08-20"
    validations:
      required: false
  - type: input
    id: listing-month
    attributes:
      label: "Listing month"
      description: Required when the start date is unknown. Use `YYYY-MM` to place the event in that month on the calendar; this does not show a date in the event details. If a start date is supplied, its month is used.
      placeholder: "2024-08"
    validations:
      required: false
  - type: input
    id: end-date
    attributes:
      label: "End date"
      description: Optional. ISO `YYYY-MM-DD`, only when explicitly known. Requires a start date and must be on or after it.
      placeholder: "2024-08-22"
    validations:
      required: false
  - type: input
    id: time
    attributes:
      label: "Time (with timezone)"
      placeholder: "14:00–16:00 EDT"
    validations:
      required: false
  - type: input
    id: location
    attributes:
      label: "Location"
      description: Optional. Only give a venue explicitly named in the source. Put meeting links under a `## Links` heading in the description below; the registration link has its own field.
      placeholder: "Université de Sherbrooke, room D7-1010 (hybrid)"
    validations:
      required: false
  - type: input
    id: contributors
    attributes:
      label: "Contributors / speakers"
      description: Comma-separated. Saved as a `contributors` array in `events.json`. Use `team.json` spelling for lab members so their photos and profile links appear; anyone else is shown with the lab logo. These names appear under Researchers in the event; do not repeat them in an Authors section.
      placeholder: "Mahdi Loutfi"
    validations:
      required: true
  - type: textarea
    id: blurb
    attributes:
      label: "Short blurb"
      description: Optional. Not shown on the calendar card; if provided, this becomes the opening paragraph of the markdown file.
      placeholder: "Mahdi Loutfi's MSc thesis defense."
    validations:
      required: false
  - type: textarea
    id: body
    attributes:
      label: "Full description (Markdown)"
      description: |
        Saved to `src/content/community/events/<slug>.md`. Supports inline HTML and standard Markdown images.
        Pictures are shown on the event's calendar card and in its gallery, not inside the text: the first photo is the card's cover (up to three are stacked), and wide logos or banners appear as a small badge on the card. Put links under a `## Links` heading, one `- [label](url)` per line.
        Drag images (PNG, JPG, GIF, WebP) or PDFs straight into this field, at most 10 MB each. The automation copies them into the repository, links the post to those copies, and makes small previews of the images for the calendar.
        Image links to other sites, such as `![description](https://example.com/image.jpg)`, remain externally hosted: use stable, public URLs only.
      placeholder: "Abstract, agenda, speaker bios, etc. Available date, type, venue, and contributors appear automatically in the event details."
    validations:
      required: true
  - type: input
    id: registration
    attributes:
      label: "Registration / RSVP link"
      description: Optional. Added as "Registration" to the event's links.
      placeholder: "Optional"
    validations:
      required: false
  - type: textarea
    id: assets
    attributes:
      label: "Images / attachments for maintainer review"
      description: |
        Attach files a maintainer should review but that should not appear on the website as they are. Files here are not copied or published; put anything readers should see in the content field instead. Include descriptive alt text and the intended photo order.
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: "Related issues / PRs and publication order"
      description: Optional. Link any related issues or PRs. If something must be merged or published before this entry, explain what and why. These notes appear in the generated PR for maintainer review, not on the website; they do not create companion entries or enforce merge order.
      placeholder: "Merge the related publication in #123 before publishing this event."
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: "Additional context"
      placeholder: "Optional."
    validations:
      required: false
