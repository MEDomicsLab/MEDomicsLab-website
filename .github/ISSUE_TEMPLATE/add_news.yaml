name: "Add a news post"
description: Share lab news (publication announcement, award, new joiner, milestone, blog post…).
title: "[NEWS] - <headline>"
labels:
  - "content"
  - "news"
assignees:
  - "simonprovost"
body:
  - type: markdown
    attributes:
      value: |
        <div align="center">
          <a href="https://medomicslab.com/">
            <img src="https://raw.githubusercontent.com/MEDomicsLab/MEDomicsLab-website/refs/heads/main/docs/assets/banner/medomicslab-banner.webp" alt="MEDomicsLab banner" width="320">
          </a>
          <br>
          <strong>Official MEDomicsLab's Website.</strong>
          <br>
          <a href="https://medomicslab.com/">Live site</a>
        </div>


        News items are grouped by year → month. The listing card shows the title only — all prose lives in the markdown file.

        See [`src/content/_templates/news.md`](https://github.com/MEDomicsLab/MEDomicsLab-website/blob/main/src/content/_templates/news.md) for the markdown skeleton.
  - type: checkboxes
    id: checks
    attributes:
      label: "Before submitting"
      options:
        - label: This news item is suitable for public posting and all named people consent.
          required: true
        - label: Names of lab members match `src/data/team.json` exactly (so the cross-link works).
          required: true
  - type: input
    id: title
    attributes:
      label: "Headline"
      description: One sentence, no trailing period if avoidable.
      placeholder: 'Publication of the article "…" in <Journal>'
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: "Suggested slug"
      description: Lowercase, hyphenated. An ISO date prefix is optional. Becomes `/community/news/<slug>`.
      placeholder: "2025-03-04-post-longitudinal-oym-article"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: "Category"
      description: Drives the filter on the News page. Saved as `category` in `news.json`.
      options:
        - "Publications"
        - "Thesis Defenses"
        - "Awards"
        - "Milestones"
        - "Conferences"
        - "Other"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: "Publish date"
      description: ISO `YYYY-MM-DD`. The planned website publish date determines the timeline group only; it is not displayed as the date of the reported news or event.
      placeholder: "2025-03-04"
    validations:
      required: true
  - type: input
    id: display-date
    attributes:
      label: "Date to display"
      description: Optional. Exact publication, milestone, or event date in `YYYY-MM-DD`, only when explicitly stated in the source text, title, or images. Leave blank when unknown; do not infer it from a filename or DOI.
      placeholder: "2026-08-27"
    validations:
      required: false
  - type: input
    id: event-end-date
    attributes:
      label: "Event end date"
      description: Optional, for a multi-day event. ISO `YYYY-MM-DD`. Requires a date to display and must be on or after it.
    validations:
      required: false
  - type: input
    id: event-kind
    attributes:
      label: "Event kind"
      description: Optional, for news about an event. Displayed as Type in the sidebar.
      placeholder: "Thesis defense (MSc), Community of practice, Workshop"
    validations:
      required: false
  - type: input
    id: event-venue
    attributes:
      label: "Event venue"
      description: Optional. Only give a venue explicitly named in the source. Keep event and slide-deck links in the Markdown body.
      placeholder: "Mila, Montréal"
    validations:
      required: false
  - type: input
    id: contributors
    attributes:
      label: "Contributors / people involved"
      description: Comma-separated. Saved as a `contributors` array in `news.json`. Use `team.json` spelling for lab members so cross-links work. These names appear in the Researchers sidebar; do not repeat them in an Authors section.
      placeholder: "Hakima Laribi, Nicolas Raymond, Martin Vallières"
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: "Full content (Markdown)"
      description: |
        Saved to `src/content/community/news/<slug>.md` and referenced from `news.json` via the `markdown` field. The listing card has no blurb anymore, so the opening paragraph here is what readers see first. Supports standard Markdown plus:
        - Inline HTML (rendered via `rehype-raw`)
        - Standard Markdown images, one per paragraph, displayed at full width with rounded corners.
        - External image Markdown such as `![description](https://example.com/image.jpg)`. These images are hotlinked, so use stable, public URLs only; they are not copied or optimized by this form.
      placeholder: "Announcement, paragraphs, links, images, etc. Available dates, event details, and contributors appear in the sidebar."
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: "Images / attachments for maintainer review"
      description: Attach files a maintainer should review. They are not automatically copied to the repository or published; a maintainer will add approved assets to the PR.
    validations:
      required: false
  - type: dropdown
    id: related
    attributes:
      label: "Related content to publish alongside?"
      description: For maintainer review. Submit a separate form for each companion entry; these selections do not create it automatically.
      multiple: true
      options:
        - "New publication entry"
        - "New event entry"
        - "New course entry"
        - "Update an existing team member"
  - type: textarea
    id: additional
    attributes:
      label: "Additional context"
      placeholder: "Optional — embargo dates, social media links, etc."
    validations:
      required: false
