name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high

  osv-scanner:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install osv-scanner
        run: |
          curl -sSL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
      - name: Scan dependencies (report-only)
        # CLI (not the reusable workflow): the reusable workflow requires
        # GitHub Code Scanning which is unavailable on free private repos.
        # Report-only: dev-dep advisories surfaced here; production deps are
        # gated by the `npm audit` job below.
        run: /tmp/osv-scanner scan --lockfile=package-lock.json || true

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan repository history
        # Use the CLI directly: gitleaks-action@v2 needs write API perms that
        # GITHUB_TOKEN does not have in private repos.
        run: gitleaks detect --redact --no-banner --verbose --exit-code 1
